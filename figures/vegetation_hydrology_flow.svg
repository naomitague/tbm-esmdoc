<svg width="820" height="1026" viewBox="0 0 820 1026" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Vegetation change and hydrology change as a two-way coupling</title>
<desc>Climate, disturbance, and human drivers on the left feed into a column of growth, mortality/removal, and community composition modules, with ecophysiology as an underlying shadow layer. A large double-headed arrow links that vegetation change with a vertical hydrology column below it — snow, evapotranspiration, subsurface storage, and stream/river flow — the two driving each other: vegetation sets the surface fluxes, and water availability in turn limits growth, drives mortality, and shifts composition. A faint dashed path additionally returns from subsurface storage to climate. Hand-edited after export: the two-way arrow and the data-process-id attributes would be lost if this figure were regenerated from source.</desc>
<style>
