.c-teal-text-sub { fill: #0F6E56; }
.c-coral-fill { fill: #FAECE7; stroke: #993C1D; }
.c-coral-text-title { fill: #712B13; }
.c-coral-text-sub { fill: #993C1D; }
.c-blue-fill { fill: #E6F1FB; stroke: #185FA5; }
.c-blue-text-title { fill: #0C447C; }
.c-blue-text-sub { fill: #185FA5; }
.c-green-fill { fill: #EAF3DE; stroke: #3B6D11; }
.c-green-text-title { fill: #27500A; }
.c-green-text-sub { fill: #3B6D11; }
.c-purple-fill { fill: #EEEDFE; stroke: #534AB7; }
.c-purple-text-title { fill: #3C3489; }
.c-purple-text-sub { fill: #534AB7; }
rect.link-box { stroke-width: 1; }
rect:not(.link-box) { stroke-width: 0.5; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
