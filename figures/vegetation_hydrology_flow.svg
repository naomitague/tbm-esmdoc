.sec { font-size: 16px; font-weight: 700; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 11.5px; font-weight: 400; }
.link-box { stroke-dasharray: 4 3; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.conv { stroke: #5F5E5A; stroke-width: 1; fill: none; }
.c-gray-fill { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray-text-title { fill: #2C2C2A; }
.c-gray-text-sub { fill: #5F5E5A; }
.c-red-fill { fill: #FCEBEB; stroke: #A32D2D; }
.c-red-text-title { fill: #791F1F; }
.c-red-text-sub { fill: #A32D2D; }
.c-amber-fill { fill: #FAEEDA; stroke: #854F0B; }
.c-amber-text-title { fill: #633806; }
.c-amber-text-sub { fill: #854F0B; }
.c-teal-fill { fill: #E1F5EE; stroke: #0F6E56; }
